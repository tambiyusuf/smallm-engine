name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cpu-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_CXX_COMPILER=g++
          cmake --build build -j
